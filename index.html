<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo App</title>

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>

  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

  <link rel="stylesheet" href="/assest/styles/Styles.css" />

  <style>
    [type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.5);
    }
    .dark [type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
    }
  </style>
</head>

<body class="text-white min-h-screen px-4 py-6 dark-mode">
  <div class="max-w-2xl mx-auto space-y-6">
    
    <header class="flex justify-between items-center">
      <h1 class="text-3xl font-bold">Todo App</h1>
      <button id="theme-toggle" class="p-2 rounded-full bg-gray-300 dark:bg-gray-700 hover:bg-gray-400 dark:hover:bg-gray-600 transition-colors">
        <i class="fas fa-sun hidden dark:block text-yellow-400 text-3xl"></i>
      </button>
    </header>

    
    <div class="relative">
      <input id="searchInput" type="text" placeholder="       Search todos..." class="w-full p-3 rounded bg-gray-800 text-white placeholder-gray-400"/>
      <i class="fas fa-search absolute left-3 top-3.5 text-gray-400 dark:text-gray-500"></i>
    </div>

    
    <div class="flex items-center gap-2 flex-wrap">
      <button data-filter="all" class="px-3 py-1 rounded bg-blue-600 text-white">All <span id="count">(0)</span></button>
      <button data-filter="active" class="px-3 py-1 rounded bg-gray-600 text-white">Active</button>
      <button data-filter="completed" class="px-3 py-1 rounded bg-gray-600 text-white">Completed</button>
      <div class="ml-auto">
        <select class="bg-gray-700 text-white rounded px-2 py-1">
          <option>Newest first</option>
          <option>Oldest first</option>
        </select>
      </div>
    </div>

    
    <div id="todoContainer" class="space-y-2"></div>

    
    <div class="mt-4">
      <button id="add-todo" class="w-full py-2 bg-gray-800 rounded hover:bg-blue-600">
        <i class="fas fa-plus mr-2"></i> Add New Todo
      </button>
    </div>

    
    <div id="todoFormContainer" class="hidden max-w-xl mx-auto bg-[#131826] text-gray-200 p-6 rounded-2xl mt-10 shadow-lg">
      <form id="todoForm" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold mb-1">Title*</label>
          <input id="todoTitle" type="text" placeholder="What needs to be done?" class="w-full bg-gray-700 text-gray-200 placeholder-gray-400 border border-gray-600 rounded-lg px-4 py-2" required />
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Description (optional)</label>
          <textarea id="todoDescription" rows="4" placeholder="Add more details..." class="w-full bg-gray-700 text-gray-200 placeholder-gray-400 border border-gray-600 rounded-lg px-4 py-2 resize-none"></textarea>
        </div>
        <div class="flex flex-col md:flex-row gap-4">
          <div class="flex-1">
            <label class="block text-sm font-semibold mb-1">Due Date*</label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">
                <i class="fa-regular fa-calendar"></i>
              </span>
              <input id="todoDate" type="date" class="w-full bg-gray-700 text-gray-200 border border-gray-600 rounded-lg pl-10 pr-3 py-2"/>
            </div>
          </div>
          <div class="flex-1">
            <label class="block text-sm font-semibold mb-1">Priority (optional)</label>
            <select id="todoPriority" class="w-full bg-gray-700 text-gray-200 border border-gray-600 rounded-lg px-3 py-2">
              <option>No Priority</option>
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
            </select>
          </div>
        </div>
        <div class="flex justify-end gap-3 pt-3">
          <button type="button" class="px-5 py-2 rounded-lg bg-gray-600 text-white hover:bg-gray-500" id="cancelForm">Cancel</button>
          <button type="submit" class="px-5 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-500">
            <i class="fas fa-check mr-2"></i>Add Todo
          </button>
        </div>
      </form>
    </div>

    <footer class="text-center text-sm text-gray-400 mt-6">
      Made with React, TypeScript, Vite, and Tailwind CSS
    </footer>
  </div>

  <!-- JavaScript -->
  <script src="index.js"></script>
</body>
</html>
